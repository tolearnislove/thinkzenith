  --blue:       #5b9bd5;
  --purple:     #a78bfa;
  --amber:      #f5b971;
  --green:      #52c97a;
  --border:     rgba(200,216,232,0.09);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--body);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 18px 64px;
  position: relative;
}

/* ── AMBIENT GLOW (Replaces crypto SVGs) ── */
.ambient-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.glow-1 {
  position: absolute; top: -140px; right: -100px;
  width: 480px; height: 480px; border-radius: 50%;
  background: radial-gradient(circle, rgba(78,205,196,0.08) 0%, transparent 70%);
  filter: blur(40px);
}
.glow-2 {
  position: absolute; bottom: -120px; left: -100px;
  width: 460px; height: 460px; border-radius: 50%;
  background: radial-gradient(circle, rgba(91,155,213,0.08) 0%, transparent 70%);
  filter: blur(40px);
}

/* ── NOISE ── */
.noise {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  opacity: 0.25;
}

.wrap {
  position: relative; z-index: 2;
  width: 100%; max-width: 560px;
  display: flex; flex-direction: column; align-items: center;
  padding-top: 36px;
}

/* ── TOP BAR ── */
.top-bar {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 28px;
}
.status-chip {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 0.68rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--silver-mid);
  background: rgba(15,19,32,0.85); border: 1px solid var(--border);
  padding: 7px 12px; border-radius: 99px;
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 8px var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.45;transform:scale(0.75);} }

  border: 1px solid rgba(91,155,213,0.4);
  padding: 8px 15px; border-radius: 99px;
  transition: all 0.25s ease;
}
